<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マル単</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#18242B; --muted:#5B6A70; --line:#D9E0DE;
  --accent:#0F5257; --accent-ink:#FFFFFF; --accent-soft:#DCEBEA;
  --marker:#F6D55C; --ok:#2C7A4B; --ok-soft:#DDF0E3; --ng:#B63E32; --ng-soft:#F7E0DC;
  --en:"Literata", Georgia, "Times New Roman", serif;
  --ja:"Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111A1D; --surface:#18252A; --ink:#E7EEEC; --muted:#9AAAAE; --line:#2B3B40;
    --accent:#5FB3AE; --accent-ink:#0B1517; --accent-soft:#1F3A3C;
    --marker:#8A7424; --ok:#6CC990; --ok-soft:#1C3A28; --ng:#EE8A7E; --ng-soft:#43231F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111A1D; --surface:#18252A; --ink:#E7EEEC; --muted:#9AAAAE; --line:#2B3B40;
  --accent:#5FB3AE; --accent-ink:#0B1517; --accent-soft:#1F3A3C;
  --marker:#8A7424; --ok:#6CC990; --ok-soft:#1C3A28; --ng:#EE8A7E; --ng-soft:#43231F;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ja);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand small{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.brand h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.04em;line-height:1.3}
.brand .tagline{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat3{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat3 b{display:block;font-family:var(--en);font-size:32px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat3 span{font-size:12px;color:var(--muted)}
.progress.time i{background:var(--marker)}
#tleft{font-weight:700;color:var(--ink)}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.who b{color:var(--ink)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.link{border:none;background:none;padding:4px 6px;color:var(--accent);text-decoration:underline}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],textarea{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.label{font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:700;margin:0 0 8px}
h2{font-size:18px;margin:0 0 10px;text-wrap:balance}
.names{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:none;border-radius:0;background:none;padding:8px 12px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;padding:4px 12px;border-radius:999px}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:700}
.sets{display:flex;flex-direction:column;gap:8px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700;font-size:14px;margin:6px 0 6px}
.ghead + .sets{margin-bottom:12px}
.set{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.set.on{border-color:var(--accent);background:var(--accent-soft)}
.set input{width:20px;height:20px;accent-color:var(--accent)}
.set .t{font-weight:700;line-height:1.4}
.set .m{font-size:12px;color:var(--muted)}
.set .stat{text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.set .stat .due{color:var(--ng);font-weight:700}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-right:6px;vertical-align:1px}
.tag.sample{border-color:var(--marker);background:var(--marker);color:var(--ink)}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.startbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.startbar .sum{margin-right:auto;font-size:13px;color:var(--muted)}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.card .dir{font-size:12px;letter-spacing:.1em;color:var(--muted)}
.card .q{font-size:clamp(26px,7vw,38px);font-weight:700;line-height:1.3;word-break:break-word}
.card .q.en{font-family:var(--en)}
.card .q mark{background:linear-gradient(transparent 58%,var(--marker) 58%);color:inherit;padding:0 .1em}
.card .pos{font-size:13px;color:var(--muted)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.choices{grid-template-columns:1fr}}
.choice{text-align:left;padding:14px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;min-height:58px;line-height:1.4}
.choice .k{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.choice.en{font-family:var(--en);font-size:17px}
.choice:disabled{opacity:1;cursor:default}
.choice:disabled:not(.right):not(.wrong){opacity:.55}
.choice.right{background:var(--ok-soft);border-color:var(--ok)}
.choice.right .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.choice.wrong{background:var(--ng-soft);border-color:var(--ng)}
.choice.wrong .k{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.feedback{border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.feedback .v{font-weight:700}
.feedback.ok .v{color:var(--ok)} .feedback.ng .v{color:var(--ng)}
.feedback .w{font-family:var(--en);font-size:18px;font-weight:700}
.ex{font-family:var(--en);font-size:15px;color:var(--ink);border-left:3px solid var(--marker);padding-left:10px;line-height:1.6}
.ex b{background:linear-gradient(transparent 60%,var(--marker) 60%)}
.ex-src{font-size:12px;color:var(--muted)}
/* result */
.score{display:flex;align-items:baseline;gap:10px}
.score .n{font-family:var(--en);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score .d{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.05em}
td.en{font-family:var(--en);font-weight:700;white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
.note{font-size:12px;color:var(--muted)}
.kbd{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
.send{font-size:12px;color:var(--muted)}
.send.ok{color:var(--ok)} .send.ng{color:var(--ng)}
</style>
</head>

SETS.forEach(s=>{ s.words = s.words.map(w=>{ if(typeof w!=="string") return w; const [en,pos,ja,ex=""]=w.split("|"); return {en,pos,ja,ex}; }); });

const MASTER_STREAK = 2;      // 要復習から外れるまでの連続正解数
const STORE_KEY = "marunao-tango-v1";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const wkey = (sid, w) => sid + "::" + w.en;
const allWords = SETS.flatMap(s => s.words.map(w => ({...w, sid:s.id, key:wkey(s.id,w), setTitle:s.title})));
const byKey = Object.fromEntries(allWords.map(w => [w.key, w]));

let mem = {users:{}, last:null};
function load(){ try{ const r = localStorage.getItem(STORE_KEY); if(r) mem = JSON.parse(r); }catch(e){} mem.users ||= {}; }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(mem)); }catch(e){} }
load();

const ui = {view:"home", tab:"sets", course:"すべて", group:"すべて", selected:new Set(), mode:"en2ja", limit:"n10"};
let timerId = null;
let quiz = null;

function user(){ return ui.name ? (mem.users[ui.name] ||= {rec:{}}) : null; }
function rec(key){ const u = user(); return (u.rec[key] ||= {c:0, w:0, streak:0, due:false}); }
function isDue(key){ const r = user()?.rec[key]; return !!(r && r.due); }
function isMastered(key){ const r = user()?.rec[key]; return !!(r && r.c>0 && !r.due); }

function render(){
  const app = $("#app");
  if(!ui.name) return app.innerHTML = viewLogin();
  if(ui.view==="quiz") return app.innerHTML = viewQuiz();
  if(ui.view==="result") return app.innerHTML = viewResult();
  app.innerHTML = viewHome();
}

  </header>`;
}

function setStats(s){
  const keys = s.words.map(w=>wkey(s.id,w));
  const due = keys.filter(isDue).length, done = keys.filter(isMastered).length;
  return {due, done, total:keys.length};
}

      <div><p class="label">長文セット（いくつでも選べます）</p>

      <div class="sets">${gs.map(s=>{const st=setStats(s);const on=ui.selected.has(s.id);return `
        <label class="set ${on?"on":""}">

          <div><div class="t">${s.sample?'<span class="tag sample">サンプル</span>':""}${esc(s.title)}</div>
            <div class="m"><span class="tag">${esc(s.course)}</span>${esc(s.source||"")}</div>
            <div class="bar"><i style="width:${st.total?Math.round(st.done/st.total*100):0}%"></i></div></div>
          <div class="stat">${st.total}語<br>${st.due?`<span class="due">要復習 ${st.due}</span>`:`覚えた ${st.done}`}</div>
        </label>`}).join("")}</div>`}).join("") || `<p class="empty">この区分のセットはまだありません。</p>`}</div>
      <div class="opts">
        <div><p class="label">出題の向き</p><div class="seg">
          ${[["en2ja","英語 → 日本語"],["ja2en","日本語 → 英語"],["mix","まぜる"]].map(([v,l])=>`<button aria-pressed="${ui.mode===v}" data-act="mode" data-v="${v}">${l}</button>`).join("")}
        </div></div>
        <div><p class="label">問題数</p><div class="seg">
          ${[["n10","10問"],["n20","20問"],["all","ぜんぶ"]].map(([v,l])=>`<button aria-pressed="${ui.limit===v}" data-act="limit" data-v="${v}">${l}</button>`).join("")}
        </div></div>
        <div><p class="label">時間チャレンジ(時間内は何問でも)</p><div class="seg">
          ${[["t180","3分"],["t300","5分"],["t600","10分"]].map(([v,l])=>`<button aria-pressed="${ui.limit===v}" data-act="limit" data-v="${v}">${l}</button>`).join("")}
        </div></div>
      </div>
      <div class="startbar">
        <span class="sum">${ui.selected.size?`${ui.selected.size}セット・${selWords.length}語から出題`:"セットを選んでください"}</span>
        <button data-act="start" data-only="due" ${selDue.length?"":"disabled"}>まちがえた語だけ（${selDue.length}）</button>

  } else if(ui.tab==="review"){
    body = `<section class="panel">
      <h2>要復習リスト</h2>

      ${dueAll.length?`<div class="tbl"><table><thead><tr><th>英語</th><th>意味</th><th>セット</th><th style="text-align:right">×</th></tr></thead><tbody>
        ${dueAll.sort((a,b)=>rec(b.key).w-rec(a.key).w).map(w=>`<tr><td class="en">${esc(w.en)}</td><td>${esc(w.ja)}</td><td class="note">${esc(w.setTitle)}</td><td class="num">${rec(w.key).w}</td></tr>`).join("")}
        </tbody></table></div>
        <div class="startbar" style="margin-top:14px"><button class="primary" data-act="start" data-only="dueAll">要復習の語をぜんぶ解く（${dueAll.length}）</button></div>`

      <div class="row"><button data-act="export">${esc(ui.name)} さんの記録コードをコピー</button><span class="note" id="copyMsg"></span></div>
      <textarea id="codeBox" rows="3" placeholder="ここに記録コードを貼り付け"></textarea>
      <div class="row"><button data-act="import">貼り付けたコードを読み込む</button><span class="note" id="importMsg"></span></div>
    </section>`;
  }
  return header() + tabs + body;
}

/* ---------- quiz ---------- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function makeQuestion(w){
  const dir = ui.mode==="mix" ? (Math.random()<.5?"en2ja":"ja2en") : ui.mode;
  const field = dir==="en2ja" ? "ja" : "en";
  // 同じセット・同じ品詞を優先して、紛らわしい選択肢をつくる
  const pool = allWords.filter(x=>x.key!==w.key && x[field]!==w[field]);
  const rank = x => (x.sid===w.sid?2:0) + (x.pos===w.pos?1:0) + Math.random();
  const seen = new Set([w[field]]); const distract = [];
  for(const x of pool.sort((a,b)=>rank(b)-rank(a))){ if(!seen.has(x[field])){ seen.add(x[field]); distract.push(x); } if(distract.length===3) break; }
  return {w, dir, choices: shuffle([w, ...distract]), picked:null};
}

function startQuiz(words, label, limit=ui.limit){
  stopTimer();
  let list = shuffle(words);
  const timed = limit.startsWith("t");
  if(limit.startsWith("n")){ const n=+limit.slice(1); if(list.length>n) list=list.slice(0,n); }
  sendState = ["",""];
  quiz = {label, pool:words, qs:list.map(makeQuestion), i:0, wrong:[], timed, startedAt:Date.now()};
  if(timed){
    quiz.sec = +limit.slice(1); quiz.endAt = Date.now()+quiz.sec*1000;
    timerId = setInterval(tick, 250);
  }
  ui.view = "quiz"; render();
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function fmt(ms){ const t=Math.max(0,Math.ceil(ms/1000)); return Math.floor(t/60)+":"+String(t%60).padStart(2,"0"); }
function tick(){
  if(!quiz || !quiz.timed) return stopTimer();
  const rem = quiz.endAt - Date.now();
  const el=$("#tleft"), bar=$("#tbar");
  if(el) el.textContent = fmt(rem);
  if(bar) bar.style.width = Math.max(0,rem/(quiz.sec*1000)*100)+"%";
  if(rem<=0) finish();
}
function finish(){ stopTimer(); logQuiz(); ui.view="result"; render(); }

/* ---------- 先生への送信 ---------- */
const OUTBOX_KEY = "marutan-outbox";
let sendState = ["",""];
function outbox(){ try{ return JSON.parse(localStorage.getItem(OUTBOX_KEY)||"[]"); }catch(e){ return []; } }
function setOutbox(a){ try{ localStorage.setItem(OUTBOX_KEY, JSON.stringify(a)); }catch(e){} }
function logQuiz(){
  if(!quiz || quiz.logged) return;
  quiz.logged = true;
  const done = quiz.qs.filter(q=>q.picked!==null);
  if(!done.length) return;
  const wrong = [...new Map(quiz.wrong.map(w=>[w.key,w])).values()].map(w=>({en:w.en, ja:w.ja, set:w.setTitle}));
  const entry = {
    action:"log", id: Date.now().toString(36)+Math.random().toString(36).slice(2,8),
    ts: Date.now(), name: ui.name, label: quiz.label,
    mode: ({en2ja:"英→日",ja2en:"日→英",mix:"まぜる"})[ui.mode],
    limit: quiz.timed ? (quiz.sec/60)+"分チャレンジ" : done.length+"問",
    answered: done.length, correct: done.length - quiz.wrong.length,
    seconds: Math.round((Date.now()-quiz.startedAt)/1000), wrong
  };
  setOutbox([...outbox(), entry]);
  flush();
}
let flushing = false;
async function flush(){
  if(flushing || !/^https:\/\//.test(GAS_URL)) { if(!/^https:\/\//.test(GAS_URL)) setSend("ng","送信先が設定されていません"); return; }
  flushing = true;
  let q = outbox(), failed = false;
  if(q.length) setSend("", "先生に送信中…");
  for(const entry of q){
    try{
      const r = await fetch(GAS_URL, {method:"POST", body:JSON.stringify(entry)});
      const j = await r.json();
      if(!j.ok) throw new Error(j.error||"ng");
      setOutbox(outbox().filter(x=>x.id!==entry.id));
    }catch(e){ failed = true; break; }
  }
  flushing = false;
  if(q.length) setSend(failed?"ng":"ok", failed ? "送信できませんでした。次に開いたときにもう一度送ります" : "先生に送信しました");
}
function setSend(cls, msg){ sendState = [cls,msg]; const el=$("#sendMsg"); if(el){ el.className="send "+cls; el.textContent=msg; } }

function viewQuiz(){
  const q = quiz.qs[quiz.i], n = quiz.qs.length, en = q.dir==="en2ja";
  const f = en ? "ja" : "en";
  const choices = q.choices.map((c,k)=>{
    let cls = "choice" + (en?"":" en");
    if(q.picked!==null){ if(c.key===q.w.key) cls+=" right"; else if(k===q.picked) cls+=" wrong"; }
    return `<button class="${cls}" data-act="answer" data-k="${k}" ${q.picked!==null?"disabled":""}><span class="k">${k+1}</span><span>${esc(c[f])}</span></button>`;
  }).join("");
  let fb = "";
  if(q.picked!==null){
    const ok = q.choices[q.picked].key===q.w.key;
    const ex = esc(q.w.ex||"").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
    fb = `<div class="feedback ${ok?"ok":"ng"}">
      <span class="v">${ok?"正解！":"まちがい"}</span>
      <span><span class="w">${esc(q.w.en)}</span>　<span class="note">${esc(q.w.pos||"")}</span>　${esc(q.w.ja)}</span>
      ${q.w.ex?`<div class="ex">${ex}</div><div class="ex-src">出典:${esc(q.w.setTitle)}</div>`:""}
    </div>
    <div class="startbar"><button class="primary" data-act="next" id="nextBtn">${quiz.timed||quiz.i+1<n?"次へ":"結果を見る"}</button></div>`;
  }
  return header() + `
    ${quiz.timed
      ? `<div class="qhead"><span>${esc(quiz.label)}</span><span>${quiz.i+1}問目　残り <span id="tleft">${fmt(quiz.endAt-Date.now())}</span></span></div>
         <div class="progress time"><i id="tbar" style="width:${Math.max(0,(quiz.endAt-Date.now())/(quiz.sec*1000)*100)}%"></i></div>`
      : `<div class="qhead"><span>${esc(quiz.label)}</span><span>${quiz.i+1} / ${n}</span></div>
         <div class="progress"><i style="width:${(quiz.i/n)*100}%"></i></div>`}
    <div class="card">
      <span class="dir">${en?"この英語の意味は？":"この意味の英語は？"}</span>
      <span class="q ${en?"en":""}">${en?`<mark>${esc(q.w.en)}</mark>`:esc(q.w.ja)}</span>
      ${q.w.pos?`<span class="pos">${esc(posName(q.w.pos))}</span>`:""}
    </div>
    <div class="choices">${choices}</div>
    ${fb}
    <p class="kbd">キーボードの 1〜4 で選択、Enter で次へ　<button class="link" data-act="quit">やめる</button></p>`;
}
function posName(p){ return ({"名":"名詞","動":"動詞","形":"形容詞","副":"副詞","熟":"熟語・表現","前":"前置詞","接":"接続詞"})[p]||p; }

function answer(k){
  const q = quiz.qs[quiz.i]; if(q.picked!==null) return;
  q.picked = k;
  const ok = q.choices[k].key===q.w.key, r = rec(q.w.key);
  if(ok){ r.c++; r.streak++; if(r.streak>=MASTER_STREAK) r.due=false; }
  else { r.w++; r.streak=0; r.due=true; quiz.wrong.push(q.w);
    if(quiz.timed) quiz.qs.splice(quiz.i+4, 0, makeQuestion(q.w)); }
  save(); render();
  setTimeout(()=>$("#nextBtn")?.focus(),0);
}
function next(){
  if(quiz.timed && quiz.i+1>=quiz.qs.length){
    let more = shuffle(quiz.pool);
    if(more.length>1 && more[0].key===quiz.qs[quiz.i].w.key) more.push(more.shift());
    quiz.qs.push(...more.map(makeQuestion));
  }
  if(quiz.i+1<quiz.qs.length){ quiz.i++; render(); } else finish();
}

function viewResult(){
  const n = quiz.qs.filter(q=>q.picked!==null).length, ok = n - quiz.wrong.length;
  const rate = n ? Math.round(ok/n*100) : 0;
  const uniq = [...new Map(quiz.wrong.map(w=>[w.key,w])).values()];
  return header() + `<section class="panel" style="display:flex;flex-direction:column;gap:14px">
    <p class="label" style="margin:0">${esc(quiz.label)}${quiz.timed?`・${quiz.sec/60}分チャレンジ`:""}</p>
    <div class="stats">
      <div class="stat3"><b>${n}</b><span>解いた問題</span></div>
      <div class="stat3"><b>${ok}</b><span>正解</span></div>
      <div class="stat3"><b>${rate}<small style="font-size:16px">%</small></b><span>正答率</span></div>
    </div>
    ${uniq.length?`<div><p class="label">まちがえた語</p><div class="tbl"><table><tbody>
      ${uniq.map(w=>`<tr><td class="en">${esc(w.en)}</td><td>${esc(w.ja)}</td></tr>`).join("")}</tbody></table></div></div>`
      :`<p style="margin:0">${n?"全問正解です。":"1問も解かないうちに時間になりました。"}</p>`}
    <div class="startbar">
      <span class="sum" style="margin-right:auto"><span id="sendMsg" class="send ${sendState[0]||""}">${esc(sendState[1]||"")}</span></span>
      <button data-act="home">セット選択にもどる</button>
      ${uniq.length?`<button class="primary" data-act="retry">まちがえた ${uniq.length} 語をもう一度</button>`:""}
    </div>
  </section>`;
}

/* ---------- events ---------- */
document.addEventListener("submit", e=>{
  if(e.target.id!=="loginForm") return;
  e.preventDefault();
  const v = $("#nameInput").value.trim(); if(!v) return;
  ui.name = v; mem.users[v] ||= {rec:{}}; mem.last = v; save(); render();
});
document.addEventListener("change", e=>{
  const t = e.target; if(t.dataset.act!=="sel") return;
  t.checked ? ui.selected.add(t.dataset.id) : ui.selected.delete(t.dataset.id); render();
});
document.addEventListener("click", async e=>{
  const b = e.target.closest("button[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="pick"){ ui.name=b.dataset.name; mem.last=ui.name; save(); render(); }
  else if(a==="logout"){ stopTimer(); ui.name=null; ui.view="home"; render(); }
  else if(a==="tab"){ ui.tab=b.dataset.tab; render(); }
  else if(a==="course"){ ui.course=b.dataset.c; ui.group="すべて"; render(); }
  else if(a==="group"){ ui.group=b.dataset.g; render(); }
  else if(a==="selgroup"){ const gs=SETS.filter(s=>s.group===b.dataset.g&&(ui.course==="すべて"||s.course===ui.course)); const allOn=gs.every(s=>ui.selected.has(s.id)); gs.forEach(s=>allOn?ui.selected.delete(s.id):ui.selected.add(s.id)); render(); }
  else if(a==="mode"){ ui.mode=b.dataset.v; render(); }
  else if(a==="limit"){ ui.limit=b.dataset.v; render(); }
  else if(a==="start"){
    const only=b.dataset.only;
    if(only==="dueAll") startQuiz(allWords.filter(w=>isDue(w.key)),"要復習の語");
    else { const ws=allWords.filter(w=>ui.selected.has(w.sid)&&(only!=="due"||isDue(w.key)));
      const titles=SETS.filter(s=>ui.selected.has(s.id)).map(s=>s.title);
      const gs=[...new Set(SETS.filter(s=>ui.selected.has(s.id)).map(s=>s.group))];
      startQuiz(ws,(only==="due"?"まちがえた語：":"")+(titles.length>1?`${gs.join("・")} ${titles.length}セット`:titles[0])); }
  }
  else if(a==="answer") answer(+b.dataset.k);
  else if(a==="next") next();
  else if(a==="quit"||a==="home"){ stopTimer(); if(a==="quit") logQuiz(); ui.view="home"; quiz=null; render(); }
  else if(a==="retry"){ const ws=[...new Map(quiz.wrong.map(w=>[w.key,w])).values()]; startQuiz(ws,"まちがえた語をもう一度","all"); }
  else if(a==="export"){
    const code = btoa(unescape(encodeURIComponent(JSON.stringify({n:ui.name,r:user().rec}))));
    const box=$("#codeBox"); box.value=code;
    try{ await navigator.clipboard.writeText(code); $("#copyMsg").textContent="コピーしました"; }
    catch(err){ box.select(); $("#copyMsg").textContent="下の欄のコードを選択しました。コピーしてください"; }
  }
  else if(a==="import"){
    try{ const d=JSON.parse(decodeURIComponent(escape(atob($("#codeBox").value.trim()))));
      if(!d.n||!d.r) throw 0;
      const cur=(mem.users[d.n] ||= {rec:{}});
      for(const [k,r] of Object.entries(d.r)){ const c=cur.rec[k]; if(!c || (r.c+r.w)>(c.c+c.w)) cur.rec[k]=r; }
      ui.name=d.n; save(); ui.tab="sets"; render();
    }catch(err){ $("#importMsg").textContent="コードを読み込めませんでした。全部コピーできているか確認してください"; }
  }
});
document.addEventListener("keydown", e=>{
  if(ui.view!=="quiz") return;
  const q=quiz.qs[quiz.i];
  if(q.picked===null && /^[1-4]$/.test(e.key) && +e.key<=q.choices.length) answer(+e.key-1);
  else if(q.picked!==null && e.key==="Enter" && document.activeElement?.id!=="nextBtn"){ e.preventDefault(); next(); }
});
render();
flush();
</script>
